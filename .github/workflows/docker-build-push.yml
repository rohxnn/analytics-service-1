name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Docker image tag version (e.g., 1.2.0)'
        required: true

env:
  DOCKER_IMAGE_NAME: elevate-analytics
  DOCKER_REGISTRY: docker.io
  # Leave empty for personal testing (will automatically use your secrets.DOCKERHUB_USERNAME)
  # Or set to organization namespace (e.g. 'shikshalokamqa') when pushing to org repository
  DOCKER_NAMESPACE: 

jobs:
  docker-image-build-and-push:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker Namespace
        id: get-namespace
        run: |
          NAMESPACE="${{ env.DOCKER_NAMESPACE }}"
          if [ -z "$NAMESPACE" ]; then
            NAMESPACE="${{ secrets.DOCKERHUB_USERNAME }}"
          fi
          echo "Target Namespace: $NAMESPACE"
          echo "namespace=$NAMESPACE" >> $GITHUB_OUTPUT

      - name: Get Docker tag version (fail if not provided)
        id: get-version
        run: |
          if [ ! -z "${{ github.event.inputs.tag_version }}" ]; then
            VERSION="${{ github.event.inputs.tag_version }}"
          elif [ ! -z "${TAG_VERSION}" ]; then
            VERSION="${TAG_VERSION}"
          else
            echo "Error: Docker image version must be provided as workflow_dispatch input or TAG_VERSION env."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if version exists on Docker Hub
        id: check-version
        run: |
          VERSION=${{ steps.get-version.outputs.version }}
          NAMESPACE=${{ steps.get-namespace.outputs.namespace }}
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/namespaces/${NAMESPACE}/repositories/${{ env.DOCKER_IMAGE_NAME }}/tags/$VERSION")
          if [ "$RESPONSE" -eq 200 ]; then
            echo "⚠️  Warning: Tag '$VERSION' already exists on Docker Hub under namespace '$NAMESPACE'. Overwriting existing tag."
          else
            echo "✅ Tag '$VERSION' does not exist under namespace '$NAMESPACE' — proceeding with build."
          fi

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            docker.io/${{ steps.get-namespace.outputs.namespace }}/${{ env.DOCKER_IMAGE_NAME }}:${{ steps.get-version.outputs.version }}
            docker.io/${{ steps.get-namespace.outputs.namespace }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"

      - name: Print pushed tags
        run: |
          echo "Pushed tags:"
          echo "docker.io/${{ steps.get-namespace.outputs.namespace }}/${{ env.DOCKER_IMAGE_NAME }}:${{ steps.get-version.outputs.version }}"
          echo "docker.io/${{ steps.get-namespace.outputs.namespace }}/${{ env.DOCKER_IMAGE_NAME }}:latest"
